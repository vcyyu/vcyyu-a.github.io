<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WS2812 远程调色</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial;margin:20px;background:#111;color:#fff;}
.box{max-width:500px;margin:0 auto;}
.preview{width:100%;height:160px;border:none;border-radius:8px;margin-bottom:10px;}
.info{margin:15px 0;padding:12px;background:#222;font-size:16px;}
button{width:48%;padding:14px 0;font-size:18px;margin:4px 0;border:0;border-radius:6px;color:white;cursor:pointer;}
.slider-box{margin:12px 0;}
input[type="range"]{width:100%;height:12px;}
label{display:inline-block;width:60px;}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;">WS2812 远程调色</h2>
<div class="info">连接状态：<span id="status">未连接</span></div>

<div class="preview" id="colorPreview" style="background:#ff0000;"></div>

<div class="slider-box">
<label>R:</label>
<input type="range" id="rSlider" min="0" max="255" value="255">
<span id="rText">255</span>
</div>
<div class="slider-box">
<label>G:</label>
<input type="range" id="gSlider" min="0" max="255" value="0">
<span id="gText">0</span>
</div>
<div class="slider-box">
<label>B:</label>
<input type="range" id="bSlider" min="0" max="255" value="0">
<span id="bText">0</span>
</div>

<div class="slider-box">
<label>亮度：</label>
<input type="range" id="brightSlider" min="0" max="255" value="255">
<span id="brightText">255</span>
</div>

<div class="info">指令：<span id="msgText">255,0,0</span></div>

<button onclick="sendColor()" style="background:#2878eb;">发送颜色</button>
<button onclick="lightOff()" style="background:#444;">关灯</button>
</div>

<script>
// =====================【修改MQTT参数】=====================
const mqtt_host = "i11884f9.ala.cn-hangzhou.emqxsl.cn";
const mqtt_port = 8084;
const mqtt_user = "esp-rgb01";
const mqtt_pwd  = "rgb666888";
const pub_topic = "light/rgb/cmd";
// ======================================================

const clientId = "web_" + Math.random().toString(16).slice(2);
const url = `wss://${mqtt_host}:${mqtt_port}/mqtt`;
const client = mqtt.connect(url, {
  clientId: clientId,
  username: mqtt_user,
  password: mqtt_pwd
});

const statusDom = document.getElementById("status");
const colorPreview = document.getElementById("colorPreview");

const rSlider = document.getElementById("rSlider");
const gSlider = document.getElementById("gSlider");
const bSlider = document.getElementById("bSlider");
const brightSlider = document.getElementById("brightSlider");

const rText = document.getElementById("rText");
const gText = document.getElementById("gText");
const bText = document.getElementById("bText");
const brightText = document.getElementById("brightText");
const msgText = document.getElementById("msgText");

let r=255,g=0,b=0,bright=255;
let sendTimer = null;
let lastSendPayload = "";

// 更新预览色块与文字
function updateDisplay(){
  rText.innerText = r;
  gText.innerText = g;
  bText.innerText = b;
  brightText.innerText = bright;
  colorPreview.style.background = `rgb(${r},${g},${b})`;
}

//防抖
function autoSend(){
  clearTimeout(sendTimer);
  sendTimer = setTimeout(()=>{
    sendColor();
  },200);
}

//滑块绑定
rSlider.oninput = function(){ r = +this.value; updateDisplay(); autoSend(); }
gSlider.oninput = function(){ g = +this.value; updateDisplay(); autoSend(); }
bSlider.oninput = function(){ b = +this.value; updateDisplay(); autoSend(); }
brightSlider.oninput = function(){ bright = +this.value; updateDisplay(); autoSend(); }

//发送指令
function sendColor(){
  const scale = bright / 255.0;
  const rr = Math.round(r * scale);
  const gg = Math.round(g * scale);
  const bb = Math.round(b * scale);
  const payload = `${rr},${gg},${bb}`;

  if(payload === lastSendPayload) return;

  msgText.innerText = payload;
  client.publish(pub_topic, payload, {qos:1});
  lastSendPayload = payload;
}

//关灯
function lightOff(){
  const payload = "0,0,0";
  if(payload === lastSendPayload) return;
  client.publish(pub_topic, payload, {qos:1});
  lastSendPayload = payload;

  r=0;g=0;b=0;
  brightSlider.value=255;
  bright=255;
  rSlider.value=0;
  gSlider.value=0;
  bSlider.value=0;
  updateDisplay();
  msgText.innerText=payload;
}

client.on("connect", ()=>{
  statusDom.innerText = "✅ 已连接MQTT";
});
client.on("error", (err)=>{
  statusDom.innerText = "❌ 连接失败："+err;
});
client.on("close", ()=>{
  statusDom.innerText = "⚠️ 连接断开，尝试重连...";
  setTimeout(()=>client.reconnect(),2000);
});

updateDisplay();
</script>
</body>
</html>
