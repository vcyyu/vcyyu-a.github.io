<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WS2812 固定色彩控制</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial;margin:16px;background:#111;color:#fff;}
.box{max-width:520px;margin:0 auto;}
.info{padding:12px;background:#222;font-size:16px;margin-bottom:15px;}
.btn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
button{padding:16px 0;border:0;border-radius:8px;font-size:17px;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;">灯带色彩控制</h2>
<div class="info">连接状态：<span id="status">未连接</span></div>

<div class="btn-grid">
<button onclick="sendRGB('255,0,0')" style="background:#ff2222;">赤</button>
<button onclick="sendRGB('255,110,0')" style="background:#ff7800;">橙</button>
<button onclick="sendRGB('255,255,0')" style="background:#ffdd00;color:#000;">黄</button>

<button onclick="sendRGB('0,220,0')" style="background:#00c030;">绿</button>
<button onclick="sendRGB('0,220,180')" style="background:#00c8b0;">青</button>
<button onclick="sendRGB('0,80,255')" style="background:#0058ff;">蓝</button>

<button onclick="sendRGB('160,0,220')" style="background:#9000dd;">紫</button>
<button onclick="sendRGB('255,255,255')" style="background:#f8f8f8;color:#000;">白</button>

<button onclick="sendRGB('0,0,0')" style="background:#333;grid-column:1/4;">关灯</button>
</div>
</div>

<script>
// =====================【务必修改为你自己信息】=====================
const mqtt_host = "i11884f9.ala.cn-hangzhou.emqxsl.cn";
const mqtt_port = 8084;
const mqtt_user = "esp-rgb01";
const mqtt_pwd  = "rgb666888";
const pub_topic = "light/rgb/cmd";
// =================================================================

const clientId = "web_" + Math.random().toString(16).slice(2);
const url = `wss://${mqtt_host}:${mqtt_port}/mqtt`;
const client = mqtt.connect(url, {
  clientId: clientId,
  username: mqtt_user,
  password: mqtt_pwd
});

const statusDom = document.getElementById("status");
let lastCmd = "";

//发送指令 QoS=1，保证可靠送达
function sendRGB(payload){
  if(payload === lastCmd) return;
  client.publish(pub_topic, payload, {qos:1});
  lastCmd = payload;
}

client.on("connect", ()=>{
  statusDom.innerText = "✅ MQTT已连接";
});
client.on("error", (err)=>{
  statusDom.innerText = "❌ 连接异常:"+err;
});
client.on("close", ()=>{
  statusDom.innerText = "⚠️ 连接断开，等待重连";
  setTimeout(()=>client.reconnect(),2000);
});
</script>
</body>
</html>
