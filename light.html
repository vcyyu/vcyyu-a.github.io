<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WS2812 固定色彩控制 · 光标追踪</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  body{
    font-family:Arial, sans-serif;
    margin:16px;
    background:#111;
    color:#fff;
  }
  .box{ max-width:520px; margin:0 auto; }
  .info{
    padding:12px; background:#222; font-size:16px;
    margin-bottom:15px; border-radius:8px;
  }
  .btn-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  button{
    padding:16px 0;
    border:0; border-radius:8px;
    font-size:17px; color:#fff; cursor:pointer;
    transition: outline 0.1s ease, box-shadow 0.1s ease;
    outline: 2px solid transparent;
    outline-offset: 2px;
    box-shadow: 0 0 0 0 rgba(255,255,255,0);
  }
  button.cursor-active {
    outline: 2px solid rgba(255, 255, 255, 0.55);
    outline-offset: 3px;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.2);
  }
  button.cursor-active {
    outline-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 8px 1px rgba(255, 255, 255, 0.25);
  }
  .btn-breath {
    background: linear-gradient(135deg,#ff6b6b,#4ecdc4) !important;
    color:#fff !important;
  }
  .btn-rainbow {
    background: linear-gradient(90deg,#ff0000,#ff8000,#ffff00,#00ff00,#00ffff,#0000ff,#8000ff) !important;
    color:#fff !important;
    text-shadow: 0 0 4px #000;
  }
  /* 提示信息 */
  #hint {
    color:#ffaa00;
    font-size:13px;
    margin-top:10px;
    min-height:18px;
  }
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;">灯带色彩控制</h2>
<div class="info">连接状态：<span id="status">未连接</span></div>

<div class="btn-grid" id="buttonGrid">
  <!-- 静态颜色：加 data-color 属性，方便读取 -->
  <button class="color-btn" data-color="255,0,0"   onclick="sendRGB('255,0,0')"   style="background:#ff2222;">红</button>
  <button class="color-btn" data-color="255,50,0"  onclick="sendRGB('255,50,0')"  style="background:#ff7800;">橙</button>
  <button class="color-btn" data-color="255,255,0" onclick="sendRGB('255,255,0')" style="background:#ffdd00;color:#000;">黄</button>
  <button class="color-btn" data-color="0,255,0"   onclick="sendRGB('0,255,0')"   style="background:#00c030;">绿</button>
  <button class="color-btn" data-color="0,255,250" onclick="sendRGB('0,255,250')" style="background:#00ffff;">青</button>
  <button class="color-btn" data-color="0,0,255"   onclick="sendRGB('0,0,255')"   style="background:#0000ff;">蓝</button>
  <button class="color-btn" data-color="255,0,255" onclick="sendRGB('255,0,255')" style="background:#8000ff;">紫</button>
  <button class="color-btn" data-color="166,166,166" onclick="sendRGB('166,166,166')" style="background:#f8f8f8;color:#000;">白</button>
  <button class="color-btn" data-color="255,35,30" onclick="sendRGB('255,35,30')" style="background:#FFC0CB;">粉</button>
  <button class="color-btn" data-color="40,180,220" onclick="sendRGB('40,180,220')" style="background:#28B4DC;">青蓝</button>
  <button class="color-btn" data-color="0,255,55"  onclick="sendRGB('0,255,55')"  style="background:#00FF37;">青绿</button>
  <button class="color-btn" data-color="110,120,127" onclick="sendRGB('110,120,127')" style="background:#DCF0FF;">冷白</button>

  <!-- 动态效果 -->
  <button class="btn-breath" onclick="sendBreath()">呼吸灯</button>
  <button class="btn-rainbow" onclick="sendRainbow()">彩虹</button>
  <button onclick="sendRGB('0,0,0')" style="background:#333;" id="offButton">关灯</button>
</div>
<div id="hint"></div>
</div>

<script>
  // =====================【修改MQTT信息】=====================
  const mqtt_host = "i11884f9.ala.cn-hangzhou.emqxsl.cn";
  const mqtt_port = 8084;
  const mqtt_user = "esp-rgb01";
  const mqtt_pwd  = "rgb666888";
  const pub_topic = "light/rgb/cmd";
  // ============================================================

  const clientId = "web_" + Math.random().toString(16).slice(2);
  const url = `wss://${mqtt_host}:${mqtt_port}/mqtt`;
  const client = mqtt.connect(url, {
    clientId: clientId,
    username: mqtt_user,
    password: mqtt_pwd,
    keepalive: 45,
    reconnectPeriod: 1000,
    clean: true
  });

  const statusDom = document.getElementById("status");
  const hintDom = document.getElementById("hint");

  // ---------- 光标追踪 ----------
  // 注意：只有"静态颜色按钮"才会更新 activeColorButton，
  // 呼吸灯/彩虹/关灯按钮不覆盖，防止呼吸灯基色被错误覆盖
  let activeColorButton = null;
  let lastColor = null;   // 最近一次有效的静态颜色（"R,G,B" 字符串）

  function removeAllCursorClasses() {
    document.querySelectorAll('button').forEach(btn => {
      btn.classList.remove('cursor-active');
    });
  }

  function setCursorToButton(button) {
    if (!button) return;
    removeAllCursorClasses();
    button.classList.add('cursor-active');
  }

  function setHint(text) {
    hintDom.innerText = text || "";
  }

  // 给所有按钮绑光标显示，但只有 .color-btn 才更新 lastColor
  document.querySelectorAll('button').forEach(btn => {
    const handler = function() {
      setCursorToButton(this);
      if (this.classList.contains('color-btn')) {
        const c = this.getAttribute('data-color');
        if (c && c !== '0,0,0') {
          lastColor = c;
          activeColorButton = this;
          setHint("");   // 清除提示
        }
      }
    };
    btn.addEventListener('pointerdown', handler);
    btn.addEventListener('click', handler);
  });

  // ---------- 功能函数 ----------
  function sendRGB(payload) {
    if (!client.connected) {
      setHint("MQTT 未连接，请稍后重试");
      return;
    }
    client.publish(pub_topic, payload, {qos:1});

    // 维护 lastColor
    if (payload === '0,0,0') {
      // 关灯 → 清空有效颜色
      lastColor = null;
      setHint("已关灯，请先选颜色再点呼吸灯");
    } else {
      lastColor = payload;
      setHint("");
    }
  }

  // 呼吸灯：必须有有效颜色才能用
  function sendBreath() {
    if (!client.connected) {
      setHint("MQTT 未连接，请稍后重试");
      return;
    }
    if (!lastColor) {
      setHint("⚠️ 请先选择一种颜色，再点呼吸灯");
      return;
    }
    client.publish(pub_topic, "BREATH," + lastColor, {qos:1});
    setHint("呼吸灯：" + lastColor);
  }

  function sendRainbow() {
    if (!client.connected) {
      setHint("MQTT 未连接，请稍后重试");
      return;
    }
    client.publish(pub_topic, "RAINBOW", {qos:1});
    setHint("彩虹渐变");
  }

  window.sendRGB = sendRGB;
  window.sendBreath = sendBreath;
  window.sendRainbow = sendRainbow;

  // MQTT 状态
  client.on("connect", () => {
    statusDom.innerText = "✅ MQTT已连接";
  });
  client.on("error", (err) => {
    statusDom.innerText = "❌ 连接异常:" + err;
  });
  client.on("close", () => {
    statusDom.innerText = "⚠️ 连接断开，自动重连";
  });
</script>
</body>
</html>
