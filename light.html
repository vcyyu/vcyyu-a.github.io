<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS2812 远程调色</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial;margin:20px;background:#111;color:#fff;}
.box{max-width:500px;margin:0 auto;}
input[type="color"]{width:100%;height:160px;border:none;cursor:pointer;}
.info{margin:15px 0;padding:12px;background:#222;font-size:16px;}
button{width:48%;padding:14px 0;font-size:18px;margin:4px 0;border:0;border-radius:6px;color:white;cursor:pointer;}
.slider-box{margin:20px 0;}
input[type="range"]{width:100%;height:12px;}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;">WS2812 远程调色</h2>
<div class="info">连接状态：<span id="status">未连接</span></div>

<input type="color" id="colorPicker" value="#ff0000">

<div class="slider-box">
<label>亮度：<span id="brightText">255</span></label>
<input type="range" id="brightSlider" min="0" max="255" value="255">
</div>

<div class="info">指令：<span id="msgText">255,0,0</span></div>

<button onclick="sendColor()" style="background:#2878eb;">发送颜色</button>
<button onclick="lightOff()" style="background:#444;">关灯</button>
</div>

<script>
// =====================【修改这里！】=====================
const mqtt_host = "i11884f9.ala.cn-hangzhou.emqxsl.cn";
const mqtt_port = 8084;
const mqtt_user = "esp-rgb01";
const mqtt_pwd  = "rgb666888";
const pub_topic = "light/rgb/cmd";
// ======================================================

const clientId = "web_" + Math.random().toString(16).slice(2);
const url = `wss://${mqtt_host}:${mqtt_port}/mqtt`;
const client = mqtt.connect(url, {
  clientId: clientId,
  username: mqtt_user,
  password: mqtt_pwd
});

const statusDom = document.getElementById("status");
const colorPicker = document.getElementById("colorPicker");
const brightSlider = document.getElementById("brightSlider");
const brightText = document.getElementById("brightText");
const msgText = document.getElementById("msgText");

let r=255,g=0,b=0,bright=255;
let sendTimer = null;

// 十六进制 #RRGGBB 转 RGB
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16)
  };
}

// 更新页面文字显示
function updateDisplay(){
  brightText.innerText = bright;
}

// 防抖自动发送
function autoSend(){
  clearTimeout(sendTimer);
  sendTimer = setTimeout(()=>{
    sendColor();
  },200);
}

colorPicker.oninput = function(){
  const c = hexToRgb(this.value);
  r=c.r; g=c.g; b=c.b;
  updateDisplay();
  autoSend();
}

brightSlider.oninput = function(){
  bright = parseInt(this.value);
  updateDisplay();
  autoSend();
}

// 发送指令：前端预先计算亮度，下发最终RGB
function sendColor(){
  const scale = bright / 255.0;
  const rr = Math.round(r * scale);
  const gg = Math.round(g * scale);
  const bb = Math.round(b * scale);
  const payload = `${rr},${gg},${bb}`;
  msgText.innerText = payload;
  client.publish(pub_topic, payload);
}

// 关灯
function lightOff(){
  client.publish(pub_topic, "0,0,0");
  colorPicker.value="#000000";
  brightSlider.value=255;
  r=0;g=0;b=0;bright=255;
  updateDisplay();
  msgText.innerText="0,0,0";
}

client.on("connect", ()=>{
  statusDom.innerText = "✅ 已连接MQTT";
});
client.on("error", (err)=>{
  statusDom.innerText = "❌ 连接失败："+err;
  client.end();
});
client.on("close", ()=>{
  statusDom.innerText = "连接断开";
});

updateDisplay();
</script>
</body>
</html>
